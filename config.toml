# dkdc.io: Zorto configuration
base_url = "https://dkdc.io"
title = "dkdc.io"
generate_llms_txt = false

compile_sass = true
slugify.paths = "safe"

[markdown]
highlight_code = true
insert_anchor_links = "right"
highlight_theme = "css"
highlight_themes_css = [
  { theme = "base16-ocean-dark", filename = "syntax-dark.css" },
]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = true

[extra]
logo_text = "dkdc.io"
author = "Cody"
default_og_image = "dkdc2-logo-dark.png"
favicon = "/dkdc2-favicon-32.png"
favicon_mimetype = "image/png"

menu_items = [
  { name = "blog", url = "https://dkdc.dev/#posts", external = true },
]

projects = [
  { name = "Bookmarks", url = "/bookmarks", github = "dkdc-io/bookmarks", description = "Bookmarks in your filesystem." },
  { name = "MotherDuck CLI", url = "/md-cli", github = "dkdc-io/md-cli", description = "CLI for the MotherDuck REST API." },
  { name = "Zorto", url = "https://zorto.dev", github = "dkdc-io/zorto", description = "The AI-native static site generator (SSG) with executable code blocks." },
]

incubating_projects = [
  { name = "dkdc-db", url = "/db", github = "dkdc-io/db", description = "HTAP database system." },
  { name = "dkdc-draw", url = "/draw", github = "dkdc-io/draw", description = "Local-first drawing tool." },
  { name = "dkdc-home", url = "/home", github = "dkdc-io/home", description = "Home library." },
  { name = "dkdc-lm", url = "/lm", github = "dkdc-io/lm", description = "Language model service." },
  { name = "dkdc-sh", url = "/sh", github = "dkdc-io/sh", description = "Shell library." },
  { name = "StringFlow", url = "/stringflow", github = "dkdc-io/stringflow", description = "Flow strings through language models." },
]

copyright_html = '<a href="/">dkdc.io</a> by <a href="https://dkdc.dev" target="_blank" rel="noopener">dkdc.dev</a> via <a href="https://zorto.dev" target="_blank" rel="noopener">Zorto</a>'
